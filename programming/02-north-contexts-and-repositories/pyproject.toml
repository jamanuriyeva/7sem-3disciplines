[project]
name = "north-contexts-and-repositories"
version = "0.1.0"
description = "Контексты, агрегаты и репозитории магазина Север"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "sqlalchemy>=2.0,<3", "uvicorn>=0.30,<1"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
