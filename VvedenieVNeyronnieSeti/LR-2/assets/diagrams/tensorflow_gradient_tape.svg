ke-linejoin:miter;stroke-miterlimit:10;"/><path d="M490.292,231.233 C494.789,236.733 498.691,242.7 501.5,249.068 C552.809,365.363 559.603,422.014 501.5,535.068 C494.715,548.27 487.734,556.319 475.797,565.293" style="stroke:#D97706;stroke-width:1.5;stroke-dasharray:7,7;" fill="none"/><text x="544.5" y="388.103" fill="#000" font-size="15" textLength="295.307" font-family="'Noto Sans'">формы градиентов совпадают с Variable</text></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" id="lnk15" data-link-type="dependency"><polygon points="413.5,681.842,417.5,672.842,413.5,676.842,409.5,672.842,413.5,681.842" fill="#334155" style="stroke:#334155;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M413.5,629.655 C413.5,645.784 413.5,660.692 413.5,676.842" style="stroke:#334155;stroke-width:1.5;" fill="none"/></g><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" id="lnk16" data-link-type="dependency"><polygon points="413.5,779.897,417.5,770.897,413.5,774.897,409.5,770.897,413.5,779.897" fill="#334155" style="stroke:#334155;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M413.5,743.095 C413.5,754.489 413.5,762.697 413.5,774.897" style="stroke:#334155;stroke-width:1.5;" fill="none"/></g><g class="legend" data-source-line="11"><rect x="178.099" y="1012.068" width="562.802" height="90.272" fill="none" style="stroke:#000;stroke-width:1;" rx="7" ry="7"/><text x="186.739" y="1034.034" fill="#000" font-size="14" textLength="35.126" font-weight="700" font-family="'Noto Sans'">Блок</text><text x="360.31" y="1034.034" fill="#000" font-size="14" textLength="96.278" font-weight="700" font-family="'Noto Sans'">Что хранится</text><rect x="183.099" y="1038.136" width="173.571" height="19.068" fill="#DBEAFE" style="stroke:none;"/><text x="186.739" y="1053.102" fill="#000" font-size="14" textLength="166.291" font-family="'Noto Sans'">вход/временный тензор</text><text x="360.31" y="1053.102" fill="#000" font-size="14" textLen