<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:926px;height:1121px;background:#FFFFFF;" width="926px" height="1121px" viewBox="0 0 926 1121" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="10"><text x="259.455" y="24.966" fill="#000" font-size="14" textLength="400.09" font-weight="700" font-family="'Noto Sans'">GradientTape: от прямого прохода к обновлению весов</text></g><!--entity begin--><g class="entity" data-qualified-name="begin" id="ent0001" data-source-line="18"><rect x="6" y="52.068" width="294.967" height="60.86" fill="#FFF9E8" style="stroke:#181818;stroke-width:0.5;" rx="7" ry="7"/><text x="16" y="78.103" fill="#000" font-size="15" textLength="212.986" font-family="'Noto Sans'">with tf.GradientTape() as tape:</text><text x="16" y="98.533" fill="#000" font-size="15" textLength="274.967" font-family="'Noto Sans'">Создать временную запись операций</text></g><!--entity input--><g class="entity" data-qualified-name="input" id="ent0002" data-source-line="19"><rect x="67.5" y="160.068" width="171.591" height="60.86" fill="#DBEAFE" style="stroke:#181818;stroke-width:0.5;" rx="7" ry="7"/><text x="77.5" y="186.103" fill="#000" font-size="15" textLength="151.591" font-family="'Noto Sans'">Входной мини-пакет</text><text x="77.5" y="206.533" fill="#000" font-size="15" textLength="130.561" font-family="'Noto Sans'">real_images, noise</text></g><!--entity vars--><g class="entity" data-qualified-name="vars" id="ent0003" data-source-line="20"><rect x="334" y="150.068" width="209.376" height="81.29" fill="#DCFCE7" style="stroke:#181818;stroke-width:0.5;" rx="7" ry="7"/><text x="344" y="176.103" fill="#000" font-size="15" textLength="72" font-family="'Noto Sans'">G и/или D</text><text x="344" y="196.533" fill="#000" font-size="15" textLength="189.376" font-family="'Noto Sans'">читают trainable_variables</text><text x="344" y="216.963" fill="#000" font-size="15" textLength="60.93" font-family="'Noto Sans'">θ_G, θ_D</text></g><!--entity forward--><g class="entity" data-qualified-name="forward" id="ent0004" data-source-line="21"><rect x="18.5" y="291.068" width="336.052" height="60.86" fill="#DBEAFE" style="stroke:#181818;stroke-width:0.5;" rx="7" ry="7"/><text x="28.5" y="317.103" fill="#000" font-size="15" textLength="115.216" font-family="'Noto Sans'">Прямой проход</text><text x="28.5" y="337.533" fill="#000" font-size="15" textLength="316.052" font-family="'Noto Sans'">тензоры → операции → логиты/вероятности</text></g><!--entity loss--><g class="entity" data-qualified-name="loss" id="ent0005" data-source-line="22"><rect x="201.5" y="412.068" width="150.471" height="81.29" fill="#FEE2E2" style="stroke:#181818;stroke-width:0.5;" rx="7" ry="7"/><text x="211.5" y="438.103" fill="#000" font-size="15" textLength="130.471" font-family="'Noto Sans'">BCE и усреднение</text><text x="211.5" y="458.533" fill="#000" font-size="15" textLength="121.636" font-family="'Noto Sans'">d_loss или g_loss</text><text x="211.5" y="478.963" fill="#000" font-size="15" textLength="90.721" font-family="'Noto Sans'">один скаляр</text></g><!--entity grad--><g class="entity" data-qualified-name="grad" id="ent0006" data-source-line="23"><rect x="302" y="568.568" width="223.101" height="60.86" fill="#FFF9E8" style="stroke:#181818;stroke-width:0.5;" rx="7" ry="7"/><text x="312" y="594.603" fill="#000" font-size="15" textLength="203.101" font-family="'Noto Sans'">tape.gradient(loss, variables)</text><text x="312" y="615.033" fill="#000" font-size="15" textLength="198.781" font-family="'Noto Sans'">список: [∂L/∂W1, ∂L/∂b1, …]</text></g><!--entity zip--><g class="entity" data-qualified-name="zip" id="ent0007" data-source-line="24"><rect x="294.5" y="682.068" width="237.577" height="60.86" fill="#FFF9E8" style="stroke:#181818;stroke-width:0.5;" rx="7" ry="7"/><text x="304.5" y="708.103" fill="#000" font-size="15" textLength="167.581" font-family="'Noto Sans'">zip(gradients, variables)</text><text x="304.5" y="728.533" fill="#000" font-size="15" textLength="217.577" font-family="'Noto Sans'">пары «градиент — параметр»</text></g><!--entity update--><g class="entity" data-qualified-name="update" id="ent0008" data-source-line="25"><rect x="284.5" y="780.068" width="257.737" height="81.29" fill="#DCFCE7" style="stroke:#181818;stroke-width:0.5;" rx="7" ry="7"/><text x="294.5" y="806.103" fill="#000" font-size="15" textLength="204.571" font-family="'Noto Sans'">optimizer.apply_gradients(...)</text><text x="294.5" y="826.533" fill="#000" font-size="15" textLength="237.737" font-family="'Noto Sans'">Adam меняет только параметры</text><text x="294.5" y="846.963" fill="#000" font-size="15" textLength="168.931" font-family="'Noto Sans'">из переданного списка</text></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="36"><path d="M543,560.068 L543,595.068 L525.067,599.068 L543,603.068 L543,637.788 A7,7 0 0 0 550,644.788 L902.887,644.788 A7,7 0 0 0 909.887,637.788 L909.887,563.068 L899.887,553.068 L550,553.068 A7,7 0 0 0 543,560.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M899.887,553.068 L899.887,559.568 A3.5,3.5 0 0 0 903.387,563.068 L909.887,563.068 L899.887,553.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="549" y="574.103" fill="#000" font-size="15" textLength="318.857" font-family="'Noto Sans'">Непостоянный tape используется один раз:</text><text x="549" y="594.533" fill="#000" font-size="15" textLength="316.202" font-family="'Noto Sans'">после gradient() его запись освобождается.</text><text x="549" y="614.963" fill="#000" font-size="15" textLength="345.887" font-family="'Noto Sans'">Полные якобианы не строятся — выполняются</text><text x="549" y="635.393" fill="#000" font-size="15" textLength="275.807" font-family="'Noto Sans'">векторно-якобианные произведения.</text></g><g class="entity" data-qualified-name="GMN20" id="ent0021" data-source-line="42"><path d="M197.5,905.068 L197.5,982.788 A7,7 0 0 0 204.5,989.788 L622.623,989.788 A7,7 0 0 0 629.623,982.788 L629.623,908.068 L619.623,898.068 L417.5,898.068 L413.5,861.352 L409.5,898.068 L204.5,898.068 A7,7 0 0 0 197.5,905.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M619.623,898.068 L619.623,904.568 A3.5,3.5 0 0 0 623.123,908.068 L629.623,908.068 L619.623,898.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="203.5" y="919.103" fill="#000" font-size="15" textLength="392.853" font-family="'Noto Sans'">training=False меняет поведение Dropout/BatchNorm,</text><text x="203.5" y="939.533" fill="#000" font-size="15" textLength="346.382" font-family="'Noto Sans'">но не отменяет математическую производную.</text><text x="203.5" y="959.963" fill="#000" font-size="15" textLength="411.123" font-family="'Noto Sans'">stop_gradient сохраняет значение тензора, но обрывает</text><text x="203.5" y="980.393" fill="#000" font-size="15" textLength="251.237" font-family="'Noto Sans'">только путь градиента через него.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk9" data-link-type="dependency"><polygon points="153.5,159.832,157.5,150.832,153.5,154.832,149.5,150.832,153.5,159.832" fill="#334155" style="stroke:#334155;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M153.5,113.095 C153.5,127.674 153.5,140.224 153.5,154.832" style="stroke:#334155;stroke-width:1.5;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk10" data-link-type="dependency"><polygon points="173.564,291.001,174.076,281.165,171.773,286.332,166.606,284.03,173.564,291.001" fill="#334155" style="stroke:#334155;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M157.078,221.327 C159.336,236.913 162.739,256.213 167.5,273.068 C169.166,278.966 169.