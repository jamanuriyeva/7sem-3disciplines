<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1128px;height:796px;background:#FFFFFF;" width="1128px" height="796px" viewBox="0 0 1128 796" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="10"><text x="374.147" y="24.966" fill="#000" font-size="14" textLength="372.707" font-weight="700" font-family="'Noto Sans'">PyTorch Autograd: динамический граф и поля .grad</text></g><!--entity params--><g class="entity" data-qualified-name="params" id="ent0001" data-source-line="18"><rect x="64.5" y="52.068" width="159.426" height="81.29" fill="#DCFCE7" style="stroke:#181818;stroke-width:0.5;" rx="7" ry="7"/><text x="74.5" y="78.103" fill="#000" font-size="15" textLength="115.411" font-family="'Noto Sans'">Параметры G/D</text><text x="74.5" y="98.533" fill="#000" font-size="15" textLength="97.216" font-family="'Noto Sans'">nn.Parameter</text><text x="74.5" y="118.963" fill="#000" font-size="15" textLength="139.426" font-family="'Noto Sans'">requires_grad=True</text></g><!--entity input--><g class="entity" data-qualified-name="input" id="ent0002" data-source-line="19"><rect x="310" y="62.068" width="227.931" height="60.86" fill="#DBEAFE" style="stroke:#181818;stroke-width:0.5;" rx="7" ry="7"/><text x="320" y="88.103" fill="#000" font-size="15" textLength="143.881" font-family="'Noto Sans'">Входы мини-пакета</text><text x="320" y="108.533" fill="#000" font-size="15" textLength="207.931" font-family="'Noto Sans'">real_images, generator_noise</text></g><!--entity forward--><g class="entity" data-qualified-name="forward" id="ent0003" data-source-line="20"><rect x="275.5" y="193.068" width="296.602" height="60.86" fill="#DBEAFE" style="stroke:#181818;stroke-width:0.5;" rx="7" ry="7"/><text x="285.5" y="219.103" fill="#000" font-size="15" textLength="276.602" font-family="'Noto Sans'">Обычные операции прямого прохода</text><text x="285.5" y="239.533" fill="#000" font-size="15" textLength="268.862" font-family="'Noto Sans'">создают динамический граф grad_fn</text></g><!--entity loss--><g class="entity" data-qualified-name="loss" id="ent0004" data-source-line="21"><rect x="176" y="319.568" width="141.636" height="81.29" fill="#FEE2E2" style="stroke:#181818;stroke-width:0.5;" rx="7" ry="7"/><text x="186" y="345.603" fill="#000" font-size="15" textLength="98.311" font-family="'Noto Sans'">Логиты и BCE</text><text x="186" y="366.033" fill="#000" font-size="15" textLength="121.636" font-family="'Noto Sans'">d_loss или g_loss</text><text x="186" y="386.463" fill="#000" font-size="15" textLength="50.28" font-family="'Noto Sans'">скаляр</text></g><!--entity zero--><g class="entity" data-qualified-name="zero" id="ent0005" data-source-line="22"><rect x="816" y="329.568" width="296.497" height="60.86" fill="#FFF9E8" style="stroke:#181818;stroke-width:0.5;" rx="7" ry="7"/><text x="826" y="355.603" fill="#000" font-size="15" textLength="276.497" font-family="'Noto Sans'">optimizer.zero_grad(set_to_none=True)</text><text x="826" y="376.033" fill="#000" font-size="15" textLength="160.456" font-family="'Noto Sans'">очищает старые .grad</text></g><!--entity backward--><g class="entity" data-qualified-name="backward" id="ent0006" data-source-line="23"><rect x="127.5" y="466.068" width="247.237" height="81.29" fill="#FFF9E8" style="stroke:#181818;stroke-width:0.5;" rx="7" ry="7"/><text x="137.5" y="492.103" fill="#000" font-size="15" textLength="108.811" font-family="'Noto Sans'">loss.backward()</text><text x="137.5" y="512.533" fill="#000" font-size="15" textLength="207.646" font-family="'Noto Sans'">цепное правило записывает</text><text x="137.5" y="532.963" fill="#000" font-size="15" textLength="227.237" font-family="'Noto Sans'">производные в parameter.grad</text></g><!--entity step--><g class="entity" data-qualified-name="step" id="ent0007" data-source-line="24"><rect x="6" y="584.068" width="274.372" height="81.29" fill="#DCFCE7" style="stroke:#181818;stroke-width:0.5;" rx="7" ry="7"/><text x="16" y="610.103" fill="#000" font-size="15" textLength="110.491" font-family="'Noto Sans'">optimizer.step()</text><text x="16" y="630.533" fill="#000" font-size="15" textLength="254.372" font-family="'Noto Sans'">Adam изменяет только параметры</text><text x="16" y="650.963" fill="#000" font-size="15" textLength="146.806" font-family="'Noto Sans'">этого оптимизатора</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="35"><path d="M392.5,478.068 L392.5,502.568 L374.802,506.568 L392.5,510.568 L392.5,535.358 A7,7 0 0 0 399.5,542.358 L868.218,542.358 A7,7 0 0 0 875.218,535.358 L875.218,481.068 L865.218,471.068 L399.5,471.068 A7,7 0 0 0 392.5,478.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M865.218,471.068 L865.218,477.568 A3.5,3.5 0 0 0 868.718,481.068 L875.218,481.068 L865.218,471.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="398.5" y="492.103" fill="#000" font-size="15" textLength="338.897" font-family="'Noto Sans'">Градиенты накапливаются, поэтому zero_grad</text><text x="398.5" y="512.533" fill="#000" font-size="15" textLength="381.873" font-family="'Noto Sans'">нужен перед следующим backward. После backward</text><text x="398.5" y="532.963" fill="#000" font-size="15" textLength="461.718" font-family="'Noto Sans'">обычный граф освобождается, если не запрошен retain_graph.</text></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="40"><path d="M336.5,321.068 L336.5,398.788 A7,7 0 0 0 343.5,405.788 L790.528,405.788 A7,7 0 0 0 797.528,398.788 L797.528,324.068 L787.528,314.068 L523.096,314.068 L455.382,254.085 L515.096,314.068 L343.5,314.068 A7,7 0 0 0 336.5,321.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M787.528,314.068 L787.528,320.568 A3.5,3.5 0 0 0 791.028,324.068 L797.528,324.068 L787.528,314.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="342.5" y="335.103" fill="#000" font-size="15" textLength="270.602" font-family="'Noto Sans'">torch.no_grad() не строит граф вовсе.</text><text x="342.5" y="355.533" fill="#000" font-size="15" textLength="440.028" font-family="'Noto Sans'">requires_grad_(False) не создаёт .grad для выбранных весов,</text><text x="342.5" y="375.963" fill="#000" font-size="15" textLength="403.563" font-family="'Noto Sans'">но сохраняет производный путь к входу D — выходу G.</text><text x="342.5" y="396.393" fill="#000" font-size="15" textLength="406.308" font-family="'Noto Sans'">eval()/train() меняют Dropout и BatchNorm, не Autograd.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk8" data-link-type="dependency"><polygon points="359.569,192.884,353.068,185.485,355.028,190.791,349.721,192.751,359.569,192.884" fill="#334155" style="stroke:#334155;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M223.862,130.362 C266.859,150.171 314.658,172.192 355.028,190.791" style="stroke:#334155;stroke-width:1.5;" fill="none"/><text x="320" y="169.103" fill="#000" font-size="15" textLength="78.196" font-family="'Noto Sans'">веса слоёв</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk9" data-link-type="dependency"><polygon points="424,192.664,428,183.664,424,187.664,420,183.664,424,192.664" fill="#334155" style="stroke:#334155;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M424,123.163 C424,143.991 424,166.768 424,187.664" style="stroke:#334155;stroke-width:1.5;" fill="none"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk10" data-link-type="dependency"><polygon points="313.962,319.54,323.811,319.443,318.511,317.464,320.49,312.165,313.962,319.54" fill="#334155" style="stroke:#334155;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M425.364,254.128 C424.426,268.566 420.713,285.137 410,296.068 C383.58,323.027 362.287,300.666 327,314.068 C322.68,315.709 322.861,315.48 318.511,317.464" style="stroke:#334155;stroke-width:1.5;" fill="none"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk11" data-link-type="dependency"><polygon points="374.515,467.994,384.191,469.833,379.383,466.852,382.364,462.044,374.515,467.994" fill="#334155" style="stroke:#334155;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M868.635,390.684 C848.416,396.319 827.106,401.785 807,406.068 C620.854,445.716 568.913,425.339 383,466.068 C380.196,466.682 382.233,466.184 379.383,466.852" style="stroke:#334155;stroke-width:1.5;" fill="none"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="lnk12" data-link-type="dependency"><polygon points="249.9,465.83,253.649,456.723,249.762,460.832,245.652,456.944,249.9,465.83" fill="#334155" style="stroke:#334155;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M248.104,400.936 C248.663,421.152 249.203,440.634 249.762,460.832" style="stroke:#334155;stroke-width:1.5;" fill="none"/><text x="252" y="442.103" fill="#000" font-size="15" textLength="166.981" font-family="'Noto Sans'">обратный обход графа</text></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0001" id="lnk13" data-link-type="dependency"><polygon points="137.684,133.112,132.572,141.53,137.048,138.071,140.507,142.547,137.684,133.112" fill="#D97706" style="stroke:#D97706;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M209.816,465.64 C194.342,448.598 177.882,427.671 167,406.068 C122.092,316.915 129.111,199.969 137.048,138.071" style="stroke:#D97706;stroke-width:1.5;stroke-dasharray:7,7;" fill="none"/><text x="138" y="290.103" fill="#000" font-size="15" textLength="261.362" font-family="'Noto Sans'">`.grad` той же формы, что параметр</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0007" id="lnk14" data-link-type="dependency"><polygon points="119.84,583.888,119.5,574.046,117.653,579.392,112.306,577.545,119.84,583.888" fill="#334155" style="stroke:#334155;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M122.423,133.292 C110.874,158.192 99,191.377 99,222.568 C99,222.568 99,222.568 99,507.568 C99,534.169 107.053,557.604 117.653,579.392" style="stroke:#334155;stroke-width:1.5;" fill="none"/></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" id="lnk15" data-link-type="dependency"><polygon points="180.066,583.756,189.126,579.895,183.473,580.097,183.271,574.444,180.066,583.756" fill="#334155" style="stroke:#334155;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M214.135,547.164 C203.135,558.978 194.485,568.269 183.473,580.097" style="stroke:#334155;stroke-width:1.5;" fill="none"/></g><g class="legend" data-source-line="11"><rect x="334.301" y="687.068" width="452.398" height="90.272" fill="none" style="stroke:#000;stroke-width:1;" rx="7" ry="7"/><text x="342.941" y="709.034" fill="#000" font-size="14" textLength="35.126" font-weight="700" font-family="'Noto Sans'">Блок</text><text x="479.44" y="709.034" fill="#000" font-size="14" textLength="116.928" font-weight="700" font-family="'Noto Sans'">Что он означает</text><rect x="339.301" y="713.136" width="136.499" height="19.068" fill="#DBEAFE" style="stroke:none;"/><text x="342.941" y="728.102" fill="#000" font-size="14" textLength="129.219" font-family="'Noto Sans'">временный тензор</text><text x="479.44" y="728.102" fill="#000" font-size="14" textLength="298.619" font-family="'Noto Sans'">значение и связь `grad_fn` в текущем графе</text><rect x="339.301" y="732.204" width="136.499" height="19.068" fill="#DCFCE7" style="stroke:none;"/><text x="342.941" y="747.17" fill="#000" font-size="14" textLength="100.884" font-family="'Noto Sans'">параметр-лист</text><text x="479.44" y="747.17" fill="#000" font-size="14" textLength="269.261" font-family="'Noto Sans'">`requires_grad